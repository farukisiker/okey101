name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['ios-*']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.farukisiker.okey101
  ASC_KEY_ID: 8A9NPVKUG3
  ASC_ISSUER_ID: 824671a4-c87f-4324-b2dd-952f240aac00
  TESTERS: mfaruk.isiker@gmail.com,evsconnecting@gmail.com

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8 secret'ı yok (AuthKey_${ASC_KEY_ID}.p8 dosyasının içeriği)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Team ID / bundle ID
        run: |
          TEAM_ID=$(python scripts/asc.py team --bundle-id "$BUNDLE_ID")
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "VERSION=$(node -p "require('./app/app.json').expo.version")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Expo prebuild
        working-directory: app
        env:
          CI: 1
        run: |
          npx expo prebuild --platform ios --clean
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Okey101/Info.plist

      - name: Archive
        working-directory: app/ios
        env:
          EXPO_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Okey101.xcworkspace \
            -scheme Okey101 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Okey101.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*signing|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/Okey101.xcarchive"

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Okey101.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: TestFlight testers
        run: python scripts/asc.py testflight --bundle-id "$BUNDLE_ID" --version "$VERSION" --build "$BUILD_NUMBER" --emails "$TESTERS"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
