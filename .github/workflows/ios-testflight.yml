name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['ios-*']
    # workflow_dispatch only shows up once this file is on the default branch;
    # until then, pushes to the app branch build.
    branches: [feat/okey101-app]
    paths: [app/**, shared/**, scripts/**, .github/workflows/ios-testflight.yml]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.farukisiker.okey101
  ASC_KEY_ID: 8A9NPVKUG3
  ASC_ISSUER_ID: 824671a4-c87f-4324-b2dd-952f240aac00
  TESTERS: mfaruk.isiker@gmail.com,evsconnecting@gmail.com

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26+).
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      # Repo secrets: ASC_KEY_P8 (contents of AuthKey_<KEYID>.p8), optional APPLE_TEAM_ID.
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8 secret'ı yok (AuthKey_${ASC_KEY_ID}.p8 dosyasının içeriği)."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || { echo "::error::ASC_KEY_P8 bir .p8 anahtarı değil"; exit 1; }
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          pip3 install --quiet --break-system-packages pyjwt cryptography

      - name: Team ID, bundle ID, app record
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          TEAM_ID=$(python3 scripts/asc.py team --bundle-id "$BUNDLE_ID")
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "VERSION=$(node -p "require('./app/app.json').expo.version")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Expo prebuild
        working-directory: app
        env:
          CI: 1
        run: |
          npx expo prebuild --platform ios --clean
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Okey101/Info.plist

      - name: Archive (unsigned)
        working-directory: app/ios
        env:
          EXPO_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Okey101.xcworkspace \
            -scheme Okey101 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Okey101.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/archive.log" | head -50; exit 1; }
          tail -3 "$RUNNER_TEMP/archive.log"

      # The API key cannot use Xcode cloud signing: create a short-lived distribution
      # certificate + App Store profile through the API and revoke both afterwards.
      - name: Signing certificate and profile
        run: |
          PROFILE_NAME=$(python3 scripts/asc.py signing --bundle-id "$BUNDLE_ID")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$(cat "$RUNNER_TEMP/p12_pw")" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          curl -sSfL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KC" || true
          security find-identity -v -p codesigning "$KC"

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Okey101.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
          mkdir -p ~/private_keys && cp "$ASC_KEY_PATH" ~/private_keys/
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: TestFlight testers
        run: python3 scripts/asc.py testflight --bundle-id "$BUNDLE_ID" --version "$VERSION" --build "$BUILD_NUMBER" --emails "$TESTERS"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Revoke signing and remove key
        if: always()
        run: |
          [ -f "${ASC_KEY_PATH:-}" ] && python3 scripts/asc.py revoke || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/p12_pw ~/private_keys/AuthKey_*.p8
