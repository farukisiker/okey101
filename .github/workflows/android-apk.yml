name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/okey101-app]
    paths: [app/**, shared/**, .github/workflows/android-apk.yml]

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Every build installs over the last one: the version code only goes up.
      - name: Version code
        working-directory: app
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            a.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
          '

      - name: Prebuild
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      # Release build signed with the template's debug key: fine for installing
      # the APK directly on phones (not for the Play Store). Phones only (ARM).
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/app-release.apk "out/okey-${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: okey-apk
          path: out/*.apk
          retention-days: 30
